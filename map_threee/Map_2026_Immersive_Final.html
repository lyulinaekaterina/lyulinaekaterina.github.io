    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: #f0f2f5; }

        /* АНИМИРОВАННЫЙ ФОН */
        .ambient-bg {
            position: absolute; top: 0; left: 0; width: 200%; height: 200%;
            background: radial-gradient(circle at center, rgba(230,240,255,0.8) 0%, rgba(255,255,255,0) 60%);
            animation: breathe 15s infinite ease-in-out alternate;
            z-index: 0; pointer-events: none;
        }
        @keyframes breathe { from { transform: translate(-25%, -25%) scale(1); } to { transform: translate(0%, 0%) scale(1.1); } }

        /* КАРТА (ВХОД) */
        #map-stage {
            width: 100vw; height: 100vh; position: relative; z-index: 1;
            opacity: 0; transform: scale(1.05) translateY(20px);
            animation: cinematicEntrance 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes cinematicEntrance { to { opacity: 1; transform: scale(1) translateY(0); } }

        /* ИНТЕРФЕЙС (СТЕКЛО) */
        .glass-panel {
            position: absolute; z-index: 10;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            border-radius: 24px;
            opacity: 0;
        }

        .header-ui {
            top: 30px; left: 50%; transform: translateX(-50%) translateY(-20px);
            padding: 16px 40px; text-align: center;
            animation: slideDownFade 1s ease-out 0.4s forwards;
        }
        .header-ui h1 { margin: 0; font-size: 22px; font-weight: 800; color: #111; letter-spacing: -0.5px; }
        .header-ui p { margin: 4px 0 0 0; font-size: 13px; font-weight: 500; color: #555; }

        .legend-ui {
            bottom: 40px; left: 40px; width: 320px; padding: 25px;
            transform: translateY(20px);
            animation: slideUpFade 1s ease-out 0.6s forwards;
        }

        @keyframes slideDownFade { to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }

        /* ШКАЛА */
        .legend-title { font-weight: 700; font-size: 14px; margin-bottom: 15px; color: #222; }
        .gradient-track {
            height: 12px; width: 100%; border-radius: 6px; position: relative; overflow: hidden;
            background: linear-gradient(90deg, #D32F2F 0%, #FFFFFF 50%, #00C853 100%);
        }
        .gradient-fill-animation {
            position: absolute; top:0; left:0; width: 100%; height: 100%;
            background: #f0f2f5;
            animation: wipeReveal 2s cubic-bezier(0.65, 0, 0.35, 1) 0.8s forwards;
        }
        @keyframes wipeReveal { to { transform: translateX(100%); } }
        
        .legend-labels { display: flex; justify-content: space-between; margin-top: 10px; font-size: 11px; font-weight: 600; color: #666; }
    </style>
</head>
